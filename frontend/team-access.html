<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>렌토 팀 접속</title>
  <style>
    body {
      max-width: 32rem;
      margin: 3rem auto;
      padding: 0 1.25rem;
      color: #23382d;
      font: 1rem/1.6 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <h1>렌토</h1>
  <p id="status" role="status">팀 접속 링크를 확인하고 있어요.</p>
  <script>
    async function openRento() {
      const status = document.querySelector("#status");
      const access = new URLSearchParams(location.hash.slice(1)).get("access");
      history.replaceState(null, "", location.pathname);
      if (!access) {
        status.textContent = "팀에서 받은 접속 링크를 다시 열어 주세요.";
        return;
      }

      try {
        const response = await fetch(location.pathname, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ access }),
        });
        if (response.ok) {
          location.replace("/");
          return;
        }
      } catch {
        // Keep the recovery instruction on the page if the request fails.
      }
      status.textContent = "접속 링크를 확인하지 못했어요. 팀에서 받은 링크를 다시 열어 주세요.";
    }
    openRento();
  </script>
</body>
</html>
